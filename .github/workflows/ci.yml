name: CI

on:
  # Branch commits are covered once via pull_request; scoping push to the
  # default branch avoids running the whole install matrix twice per commit
  # while keeping GoReleaser's direct pushes to main covered.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a branch cancels its own in-flight run. main is never
# cancelled mid-flight (schedule/dispatch runs also report refs/heads/main),
# so a published formula update always finishes validating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  brew-checks:
    name: brew style & audit
    runs-on: ubuntu-latest
    steps:
      # setup-homebrew detects that this repo is a tap and symlinks it into
      # Homebrew's Taps directory as wdm0006/tap (pointing at the checked-out
      # workspace), so `brew style`/`brew audit` can target it directly. Do NOT
      # replace that symlink with a real copy: setup-homebrew's post-job cleanup
      # runs `rm` on the symlink and fails ("Is a directory") if it's a dir.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: brew style
        run: brew style wdm0006/tap

      # Offline audit only: no --online/--strict so the job needs no network
      # fetches or full builds and stays fast and reliable.
      - name: brew audit
        run: brew audit --tap wdm0006/tap

      - name: README formula table matches Formula/
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          formulae = {}
          for f in sorted(pathlib.Path("Formula").glob("*.rb")):
              m = re.search(r'^\s*desc\s+"([^"]*)"', f.read_text(), re.M)
              if not m:
                  sys.exit(f"Formula/{f.name}: no desc string found")
              formulae[f.stem] = m.group(1)
          if not formulae:
              sys.exit("no formulae found in Formula/; the scan is broken")

          readme = pathlib.Path("README.md").read_text()
          section = re.search(r"^## Available Formulae\s*$(.*?)(?=^## |\Z)", readme, re.M | re.S)
          if not section:
              sys.exit('README.md: no "## Available Formulae" section')
          rows = {}
          for m in re.finditer(r"^\|\s*\[([^\]]+)\]\([^)]*\)\s*\|\s*(.*?)\s*\|\s*$", section.group(1), re.M):
              rows[m.group(1)] = m.group(2)
          if not rows:
              sys.exit("README.md: no formula rows found in the table; the scan is broken")

          errors = []
          for name, desc in formulae.items():
              if name not in rows:
                  errors.append(f"{name}: no README row (expected desc: {desc!r})")
              elif rows[name] != desc:
                  errors.append(f"{name}: README desc differs\n  expected (Formula/{name}.rb): {desc!r}\n  README says:  {rows[name]!r}")
          for name in rows:
              if name not in formulae:
                  errors.append(f"{name}: README row has no Formula/{name}.rb")
          if errors:
              sys.exit("README.md formula table is out of sync with Formula/:\n" + "\n".join(errors))
          print(f"README table matches {len(formulae)} formulae: {', '.join(formulae)}")
          PY

      - name: brew audit online
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: brew audit --tap wdm0006/tap --online

  formula-changes:
    name: Detect changed formulae
    runs-on: ubuntu-latest
    outputs:
      formulae: ${{ steps.changes.outputs.formulae }}
    steps:
      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect changed formulae
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            formulae='["vanity","rampart","stargazers"]'
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            formulae="$(git ls-tree -r --name-only "$HEAD_SHA" Formula |
              sed -n 's#^Formula/\(.*\)\.rb$#\1#p' |
              jq -Rsc 'split("\n") | map(select(length > 0))')"
          else
            formulae="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- Formula |
              sed -n 's#^Formula/\(.*\)\.rb$#\1#p' |
              jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"

  vanity-smoke-test-ubuntu:
    name: brew install & test (vanity, ubuntu-latest)
    needs: formula-changes
    if: contains(fromJSON(needs.formula-changes.outputs.formulae), 'vanity')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install formula
        run: brew install wdm0006/tap/vanity

      - name: Test formula
        run: brew test wdm0006/tap/vanity

  vanity-smoke-test-macos:
    name: brew install & test (vanity, macos-latest)
    needs: formula-changes
    if: contains(fromJSON(needs.formula-changes.outputs.formulae), 'vanity')
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install formula
        run: brew install wdm0006/tap/vanity

      - name: Test formula
        run: brew test wdm0006/tap/vanity

  rampart-smoke-test-ubuntu:
    name: brew install & test (rampart, ubuntu-latest)
    needs: formula-changes
    if: contains(fromJSON(needs.formula-changes.outputs.formulae), 'rampart')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install formula
        run: brew install wdm0006/tap/rampart

      - name: Test formula
        run: brew test wdm0006/tap/rampart

  rampart-smoke-test-macos:
    name: brew install & test (rampart, macos-latest)
    needs: formula-changes
    if: contains(fromJSON(needs.formula-changes.outputs.formulae), 'rampart')
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install formula
        run: brew install wdm0006/tap/rampart

      - name: Test formula
        run: brew test wdm0006/tap/rampart

  stargazers-smoke-test-ubuntu:
    name: brew install & test (stargazers, ubuntu-latest)
    needs: formula-changes
    if: contains(fromJSON(needs.formula-changes.outputs.formulae), 'stargazers')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install formula
        run: brew install wdm0006/tap/stargazers

      - name: Test formula
        run: brew test wdm0006/tap/stargazers

  stargazers-smoke-test-macos:
    name: brew install & test (stargazers, macos-latest)
    needs: formula-changes
    if: contains(fromJSON(needs.formula-changes.outputs.formulae), 'stargazers')
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check out tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

